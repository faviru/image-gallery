<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio player</title>
  <link rel="icon" type="image/x-icon" href="./img/favicon-96x96.png">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
</head>

<body>
  <header>
    <a href="#!" class="logo">
      <h1 class="logo__title">Image Gallery</h1>
    </a>
    <div class="search">
      <svg class="search__icon">
        <use xlink:href="./img/sprite.svg#search-icon"></use>
      </svg>
      <input type="text" class="search__field" placeholder="Search..." autocomplete="off" autofocus>
      <svg class="search__clear">
        <use xlink:href="./img/sprite.svg#close-icon"></use>
      </svg>
    </div>
  </header>
  <main>
    <section class="gallery">
      <div class="gallery__column"></div>
      <div class="gallery__column"></div>
      <div class="gallery__column"></div>
    </section>
  </main>
  <footer>
    <a href="https://rs.school/courses/javascript-preschool-ru">
      <svg class="rss-logo">
        <use xlink:href="./img/sprite.svg#rss-logo"></use>
      </svg>
      RS SCHOOL</a>
    <div class="author__container">
      <p><a href="https://github.com/faviru">https://github.com/faviru</a> © 2025</p>
    </div>
  </footer>
  <script type="module" src="./script.js"></script>
</body>

</html>
